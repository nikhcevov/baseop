[project]
name = "baseop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Vladimir Ovechkin", email = "ovchingus@gmail.com" }]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
baseop = "baseop:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
